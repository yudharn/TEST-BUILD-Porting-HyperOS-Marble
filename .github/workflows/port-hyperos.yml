name: Port HyperOS -> marble (Recovery)

# Quick-port HyperOS dari device donor ke POCO F5 (marble).
# Base (firmware, vendor_boot, dtbo, vendor, odm, vendor_dlkm) = zip xiaomi.eu marble
# Port (system, system_ext, product, mi_ext)                   = OTA ROM donor HyperOS
# boot.img = kernel custom (BOOT_IMG), recovery.img tidak ikut.
# Output: zip flashable recovery (OrangeFox), susunan sama dengan zip xiaomi.eu:
#   META-INF/ (installer xiaomi.eu, cuma flash, tanpa wipe) + images/*.img + images/super.img.0..8

on:
  workflow_dispatch:
    inputs:
      base_rom_url:
        description: "URL zip xiaomi.eu marble (zip recovery; META-INF & firmware-nya dipakai)"
        required: false
        default: "https://downloads.sourceforge.net/project/xiaomi-eu-multilang-miui-roms/xiaomi.eu/HyperOS-STABLE-RELEASES/HyperOS3.0/xiaomi.eu_MARBLE_OS3.0.5.0.VMRCNXM_15.zip?ts=gAAAAABqumL60xOKGI5GPuiICx5kFfeQy9VTpzQlR1z5bFdriOEnNp2LBD20UdfA95pWcu_dm3iMZRe3KvIbRGnbB0z2thETdA%3D%3D&use_mirror=sf-west-interserver-1&r=https%3A%2F%2Fsourceforge.net%2Fprojects%2Fxiaomi-eu-multilang-miui-roms%2Ffiles%2Fxiaomi.eu%2FHyperOS-STABLE-RELEASES%2FHyperOS3.0%2F"
        type: string
      port_rom_url:
        description: "URL OTA full ROM donor HyperOS A16/A17 (.zip berisi payload.bin)"
        required: true
        type: string
      super_size:
        description: "Ukuran partisi super (byte). marble = 9663676416. auto = baca dari metadata super ROM base"
        required: false
        default: "9663676416"
        type: string
      ext4_partitions:
        description: "Partisi yang dibangun EXT4 (sisanya EROFS). Pilihan: system system_ext product mi_ext vendor odm vendor_dlkm"
        required: false
        default: "system system_ext product mi_ext vendor odm vendor_dlkm"
        type: string
      debloat:
        description: "Debloat tambahan: package / folder / path, pisah spasi (mis. product/app/Foo)"
        required: false
        default: ""
        type: string
      unlock_features:
        description: "Fitur device_features, format nama:tipe:nilai pisah spasi (mis. support_smart_fps:bool:true). Kosong = default script, none = matikan"
        required: false
        default: ""
        type: string
      disable_encryption:
        description: "Matikan fileencryption/metadata_encryption di fstab"
        required: false
        default: true
        type: boolean
      rw_mount:
        description: "Mount partisi EXT4 sebagai rw"
        required: false
        default: true
        type: boolean
      debug_adb:
        description: "ADB aktif sejak boot (untuk logcat saat bootloop)"
        required: false
        default: true
        type: boolean
      recovery_img_url:
        description: "Opsional: URL recovery.img custom (OrangeFox). Kosong = recovery HP tidak disentuh"
        required: false
        default: ""
        type: string
      release_repo:
        description: "owner/repo untuk GitHub Release (kosong = upload artifact)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: port-hyperos-${{ github.ref }}
  cancel-in-progress: false

env:
  # ---- default yang bisa diubah di sini ----
  TARGET_DEVICE: marble
  PORT_PARTITIONS: "system system_ext product mi_ext"
  DISABLE_AVB: "true"
  EROFS_COMP: "lz4hc,9"
  EXT4_HEADROOM_MB: "32"       # ruang bebas tambahan tiap partisi EXT4 rw (MB). Kecil supaya semua partisi ext4 muat di super
  EXT4_MARGIN_PCT: "104"       # ukuran awal ext4 = isi x persen ini; kurang -> retry otomatis
  EXT4_RETRY_PCT: "105"        # tiap retry e2fsdroid: besarkan sekian persen
  VNDK_COMPAT: "true"          # vendor butuh VNDK APEX versi lama -> salin dari ROM base
  LINKER_CHECK: "true"         # laporan dependensi linker ELF vendor/odm (info)
  VINTF_COMPAT: "true"         # FCM level vendor tak dikenal donor -> salin compatibility_matrix.<lv>.xml dari system base ke /system/etc/vintf port
  ARCH64_FIX: auto             # auto = langkah panduan 64-bit (linker/vold/props/omx) hanya jika donor tanpa lib 32-bit | true | false
  ARCH64_COPY_LIB: auto        # auto = salin system/lib & system_ext/lib base hanya yang belum ada di donor | true = timpa semua | false = jangan salin
  GMS_FROM_BASE: auto          # auto = donor tanpa gms/gsf/Play Store -> salin dari product base | true = selalu lengkapi | false = mati
  GMS_SCOPE: core              # core = gms + gsf + vending + pendukung | all = semua com.google.android.* (kecuali WebView/Chrome/keyboard)
  APPS_FROM_URL: "true"        # ganti MiuiGallery, MiMediaEditor, MiuiCamera dengan APK dari URL di bawah (URL dikosongkan = app itu dilewati)
  GALLERY_APK: ""
  MEDIAEDITOR_APK: ""
  CAMERA_APK: "https://github.com/Yudharmdn/boot-melt-rebase/releases/download/boot-melt-rebase/Camera_6.7.000070.0.apk"
  BROWSER_FALLBACK: auto       # auto = ROM donor (setelah debloat) tanpa browser -> pasang Chrome | true = selalu | false = mati
  CHROME_APK: "https://github.com/Yudharmdn/boot-melt-rebase/releases/download/boot-melt-rebase/com.android.chrome.apkm"               # URL APK Chrome (com.android.chrome; bundle .apkm/.xapk juga boleh). Kosong = coba Chrome dari ROM base
  CHROME_FROM_BASE: "true"     # CHROME_APK kosong -> salin Chrome dari product base kalau ada
  PROP_MERGE: "true"           # salin props khas device dari product/etc/build.prop base marble
  OVERLAY_FIX: "true"          # buang overlay khas donor, salin overlay khas marble
  AOD_FIX: auto                # auto = patch DevicesAndroidOverlay (DozeService -> SystemUI) hanya kalau donor tak punya com.miui.aod | true | false
  MILLET_FIX: "true"           # ro.millet.netlink disamakan dengan marble
  INSTALLER: base               # base = pakai META-INF ROM base (xiaomi.eu) | ours = installer buatan script
  RECOVERY_SUPER: raw          # hanya INSTALLER=ours. Mode base: super mengikuti layout zip base (super.img.0..8 sparse)
  # boot.img custom (kernel melt-rebase) menggantikan boot.img base; kosongkan untuk pakai boot base
  BOOT_IMG: "https://github.com/Yudharmdn/boot-melt-rebase/releases/download/boot-melt-rebase/boot.img"
  # Gboard sebagai keyboard sistem (product/app/LatinImeGoogle); kosongkan untuk tidak menambah
  GBOARD_APK: https://github.com/Yudharmdn/boot-melt-rebase/releases/download/boot-melt-rebase/LatinImeGoogle.apk
  GBOARD_PACKAGE: com.charlie.android.inputmethod.latin
  # dari ROM base: overlay = Devices* + Aosp/Miui framework, Settings, biometrik, telephony (seperti toraidl)
  REPLACE_FROM_BASE: "device_features displayconfig overlay camera misound biometric"
  EU_SYSTEMSERVER_PATCH: "true"  # donor xiaomi.eu: kosongkan constructor SystemServerImpl (miui-services.jar), seperti toraidl
  DEBLOAT_PRESET: none         # debloat hanya dari debloat_packages.txt (safe = + hapus semua data-app)
  DEBLOAT_SAFE_KEEP: "MIUIGallery"   # folder data-app yang dipertahankan (pisah spasi)
  FIT_FALLBACK_EROFS: "false"  # false = super tidak muat -> build gagal dengan pesan jelas (tidak diam-diam jadi EROFS) | true = vendor/odm otomatis EROFS
  ZIP_LEVEL: "6"                # 1 = cepat/zip besar ... 9 = paling kecil (tahap zip lebih lama)
  TOOLKIT_REPO: toraidl/hyperos_port
  TOOLKIT_SHA: 523b0f6378e77e9e93ba6e15a064f45b26274eab
  SPLIT_SIZE: 1900M

jobs:
  port:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Kosongkan disk runner
        uses: jlumbroso/free-disk-space@v2
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependensi
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 zstd zip unzip e2fsprogs python3 default-jre-headless >/dev/null
          # apksigner + zipalign untuk menandatangani overlay AOD hasil patch (SDK Android sudah dihapus di step disk).
          # Tidak fatal: kalau paket tidak ada, port.sh hanya memberi warning.
          sudo apt-get install -y -qq apksigner zipalign >/dev/null || echo "::warning::apksigner/zipalign tidak tersedia, overlay AOD tidak ditandatangani"
          aria2c --version | head -n1
          java -version 2>&1 | head -n1

      - name: Ambil toolkit (pinned)
        run: |
          set -euo pipefail
          git init -q toolkit
          cd toolkit
          git remote add origin "https://github.com/${TOOLKIT_REPO}.git"
          git sparse-checkout set --no-cone '/bin/Linux/x86_64/' '/bin/*.py' '/bin/imgextractor/' '/bin/flash/zstd' '/bin/apktool/'
          git fetch -q --depth 1 --filter=blob:none origin "$TOOLKIT_SHA"
          git checkout -q FETCH_HEAD
          chmod +x bin/Linux/x86_64/*
          echo "TOOLS_DIR=$PWD" >> "$GITHUB_ENV"

      - name: Ambil extract.erofs terbaru (sekaiacg)
        # ROM HyperOS baru bisa pakai fitur EROFS yang belum dikenal extract.erofs lama di toolkit.
        # Kalau step ini gagal, port.sh otomatis pakai extract.erofs toolkit.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=sekaiacg/erofs-utils
          asset=$(gh release view -R "$repo" --json assets -q '.assets[].name' \
                  | grep -iE 'linux' | grep -iE 'x86_64|amd64' | head -n1)
          [ -n "$asset" ] || { echo "asset Linux x86_64 tidak ditemukan"; exit 1; }
          echo "asset: $asset"
          mkdir -p erofs-new && cd erofs-new
          gh release download -R "$repo" -p "$asset"
          case "$asset" in
            *.zip) unzip -q -o "$asset" ;;
            *.tar.gz|*.tgz) tar -xzf "$asset" ;;
            *.tar.xz) tar -xJf "$asset" ;;
          esac
          bin=$(find "$PWD" -type f -name extract.erofs | head -n1)
          [ -n "$bin" ] || { echo "extract.erofs tidak ada di $asset"; exit 1; }
          chmod +x "$bin"
          rc=0; "$bin" -V > ver.txt 2>&1 || rc=$?
          head -n 3 ver.txt
          [ "$rc" -lt 126 ] || { echo "extract.erofs tidak bisa dijalankan (rc=$rc)"; exit 1; }
          echo "EXTRACT_EROFS=$bin" >> "$GITHUB_ENV"

      - name: Pilih lokasi kerja (disk paling lega)
        run: |
          set -euo pipefail
          best="$GITHUB_WORKSPACE"; best_free=$(df --output=avail -B1 "$GITHUB_WORKSPACE" | tail -n1)
          if [ -d /mnt ]; then
            mnt_free=$(df --output=avail -B1 /mnt | tail -n1)
            if [ "$mnt_free" -gt "$best_free" ]; then
              sudo mkdir -p /mnt/port && sudo chown "$USER" /mnt/port
              best=/mnt/port; best_free=$mnt_free
            fi
          fi
          echo "WORK=$best/work" >> "$GITHUB_ENV"
          echo "OUT=$GITHUB_WORKSPACE/out" >> "$GITHUB_ENV"
          df -h "$GITHUB_WORKSPACE" /mnt 2>/dev/null || true
          echo "Lokasi kerja: $best ($((best_free / 1073741824)) GB bebas)"

      - name: Port ROM
        id: port
        env:
          BASE_ROM: ${{ inputs.base_rom_url }}
          PORT_ROM: ${{ inputs.port_rom_url }}
          SUPER_SIZE: ${{ inputs.super_size }}
          EXT4_PARTITIONS: ${{ inputs.ext4_partitions }}
          DEBLOAT: ${{ inputs.debloat }}
          DISABLE_ENCRYPTION: ${{ inputs.disable_encryption }}
          RW_MOUNT: ${{ inputs.rw_mount }}
          DEBUG_ADB: ${{ inputs.debug_adb }}
          RECOVERY_IMG: ${{ inputs.recovery_img_url }}
          UNLOCK_FEATURES: ${{ inputs.unlock_features }}
        run: |
          set -euo pipefail
          sudo -E env "PATH=$PATH" bash scripts/port.sh
          sudo chown -R "$USER" "$OUT"

      - name: Upload log kerja (hanya kalau gagal)
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: log-kerja-${{ github.run_number }}
          path: ${{ env.WORK }}/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload artifact (zip ROM langsung, tanpa dibungkus)
        if: ${{ inputs.release_repo == '' }}
        uses: actions/upload-artifact@v7
        with:
          # archive: false -> file zip ROM di-upload apa adanya; nama artifact = nama file zip
          path: ${{ steps.port.outputs.zip }}
          archive: false
          retention-days: 90
          if-no-files-found: error

      - name: Upload ke GitHub Release
        if: ${{ inputs.release_repo != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_REPO: ${{ inputs.release_repo }}
          ZIP: ${{ steps.port.outputs.zip }}
          NAME: ${{ steps.port.outputs.name }}
          PORT_VERSION: ${{ steps.port.outputs.port_version }}
          DONOR: ${{ steps.port.outputs.donor }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::secret RELEASE_TOKEN belum diisi"; exit 1; }
          cd "$(dirname "$ZIP")"
          file=$(basename "$ZIP")
          assets=("$file.sha256")
          if [ "$(stat -c%s "$file")" -gt 2000000000 ]; then
            split -b "$SPLIT_SIZE" -d -a 2 "$file" "$file.part"
            rm -f "$file"
            for p in "$file".part*; do assets+=("$p"); done
            join_note=$(printf 'File dipecah (limit 2 GB per asset). Gabungkan dulu:\n\n    Linux/macOS: cat %s.part* > %s\n    Windows:     copy /b %s.part00+%s.part01+... %s\n' "$file" "$file" "$file" "$file" "$file")
          else
            assets+=("$file")
            join_note=""
          fi
          tag="${NAME}-r${GITHUB_RUN_NUMBER}"
          {
            echo "HyperOS ${PORT_VERSION} port untuk ${TARGET_DEVICE} (donor: ${DONOR})"
            echo
            echo "Flash lewat OrangeFox/TWRP: Install zip -> Format Data (ketik yes) -> Reboot System."
            echo "Recovery HP tetap dipertahankan kecuali build memakai recovery_img_url."
            echo
            echo "$join_note"
          } > notes.md
          gh release create "$tag" "${assets[@]}" --repo "$RELEASE_REPO" \
            --title "$NAME" --notes-file notes.md

      - name: Ringkasan
        if: always()
        env:
          DONOR: ${{ steps.port.outputs.donor }}
          PORT_VERSION: ${{ steps.port.outputs.port_version }}
          NAME: ${{ steps.port.outputs.name }}
          EXT4_PARTITIONS: ${{ inputs.ext4_partitions }}
          DISABLE_ENCRYPTION: ${{ inputs.disable_encryption }}
          RW_MOUNT: ${{ inputs.rw_mount }}
          DEBUG_ADB: ${{ inputs.debug_adb }}
          UNLOCK_FEATURES: ${{ inputs.unlock_features }}
        run: |
          {
            echo "## Port HyperOS -> ${TARGET_DEVICE}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Donor | ${DONOR:-?} |"
            echo "| Versi | ${PORT_VERSION:-?} |"
            echo "| Output | ${NAME:-gagal} |"
            echo "| EXT4 | ${EXT4_PARTITIONS} |"
            echo "| Encryption off | ${DISABLE_ENCRYPTION} |"
            echo "| RW | ${RW_MOUNT} |"
            echo "| Debug ADB | ${DEBUG_ADB} |"
            echo "| Installer | ${INSTALLER} |"
            echo "| Unlock fitur | ${UNLOCK_FEATURES:-default} |"
            if ls out/*.sha256 >/dev/null 2>&1; then
              echo
              echo "SHA256: \`$(cut -d' ' -f1 out/*.sha256 | head -n1)\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
